[project]
name = "param-manager"
version = "0.5.0"
description = "Biblioteca para gerenciamento de parâmetros, com cache, armazenamento local em TinyDB e modo de desenvolvimento sem servidor."
authors = [{name = "MatheusLPolidoro", email = "mattpolidoro4@gmail.com"}]
readme = "README.md"
# Piso 3.10: python-dotenv 1.2.2, que corrige a PYSEC-2026-2270, exige
# >=3.10. Em 3.9 o teto é 1.2.1, ainda vulnerável; em 3.8, 1.0.1. Manter
# qualquer uma das duas significaria distribuir a falha.
requires-python = ">=3.10,<=3.14"

dependencies = [
    "tinydb>=4.8.0",
    "requests>=2.32.0",
    "pycryptodome==3.23.0",
    "python-dotenv==1.2.2"
]

[project.optional-dependencies]
# Front desktop. Fica em extra porque `pytauri-wheel` é um wheel nativo de
# ~10 MB que liga contra WebView2/gtk: quem só lê parâmetro num servidor
# não deve pagar por ele.
#
# O marcador de versão não é zelo. O `pytauri-wheel` publica wheels POR
# minor de CPython (cp310..cp313) e não é abi3, então em 3.14 o pip cairia
# no sdist e exigiria toolchain Rust — falha longa e ilegível no fim de um
# `pip install`. Com o marcador, o extra simplesmente não resolve ali.
front = [
    "pytauri-wheel==0.8.*; python_version < '3.14'",
    "anyio>=4.0",
]

[project.scripts]
param-manager-front = "param_manager.front.__main__:main"

[project.urls]
"Documentation" = "https://matheuslpolidoro.github.io/param-manager/"
"Source Code" = "https://github.com/MatheusLPolidoro/param-manager"
"Bug Tracker" = "https://github.com/MatheusLPolidoro/param-manager/issues"

[tool.setuptools.packages.find]
where = ["."]

# Os assets do front são arquivos comuns, não módulos: sem isto o wheel
# sai com o Python e sem a interface, e o defeito só aparece na máquina de
# quem instalou.
[tool.setuptools.package-data]
"param_manager.front" = [
    "README.md",
    "tauri.conf.json",
    "capabilities/*",
    "assets/**/*",
]

[build-system]
# Piso 62.3, e não 61.0: o glob `**` em package-data só passou a funcionar
# nessa versão. Num piso menor o build fica verde e o wheel sai sem
# `assets/js/views/`.
requires = ["setuptools>=62.3,<70"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 79
# extend-exclude (e não exclude) para preservar a lista padrão do ruff,
# que já ignora .venv/, dist/, build/ e afins. Usar `exclude` substitui
# esses defaults e faz o lint varrer o ambiente virtual do projeto.
extend-exclude = ["__init__.py", "tests/*", "docs/*", "chanlogs.d/*"]

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
markers = [
    "integracao: exercita TinyDB real em disco, sem mock de persistência",
]
# Testes de concorrência que travarem dumpam o stack de TODAS as threads
# em vez de pendurar o job até o timeout do runner.
faulthandler_timeout = 60

[tool.taskipy.tasks]
fix = "ruff check . --fix"
lint = "ruff check . --diff"
format = "ruff format ."
pre_test = "task fix"
test = "pytest . -s -x --cov=param_manager -vv"
post_test = "python -m coverage html"
test_unit = "pytest . -m 'not integracao' --cov=param_manager"
test_integracao = "pytest . -m integracao"

[tool.towncrier]
package = "param_manager"
package_dir = "."
filename = "CHANGELOG.md"
directory = "chanlogs.d"
underlines = ["=", "-", "~"]
title_format = "Versão {version} ({project_date})"
# URL do GitHub, e não do GitLab interno: o CHANGELOG desta biblioteca
# vai junto para o PyPI, e um link para `gitlab.127.0.0.1.nip.io` não
# resolve na máquina de ninguém. É o mesmo endereço já declarado em
# [project.urls].Bug Tracker. O anterior era `seu_usuario/seu_repo`.
issue_format = "[#{issue}](https://github.com/MatheusLPolidoro/param-manager/issues/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = ":warning: MUDANÇAS QUEBRADAS"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = ":zap: NOVAS FUNCIONALIDADES"
showcontent = true

[[tool.towncrier.type]]
directory = "enhancement"
name = ":rocket: OTIMIZAÇÕES"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = ":bug: CORREÇÕES"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = ":wastebasket: OBSOLETOS"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = ":shield: SEGURANÇA"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = ":open_file_folder: DOCUMENTAÇÃO"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = ":test_tube: TESTES"
showcontent = true

[[tool.towncrier.type]]
directory = "infra"
name = ":classical_building: INFRAESTRUTURA"
showcontent = true

[[tool.towncrier.type]]
directory = "chore"
name = ":broom: LIMPEZA"
showcontent = true
