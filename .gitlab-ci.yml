# Pipeline do param-manager (biblioteca cliente publicada no PyPI).
#
# O runner é docker, sem privileged e com concurrent = 1: os jobs rodam em
# série, então a ordem dos estágios é também a ordem no relógio. Segurança
# vem primeiro de propósito — não vale gastar a matriz de testes num commit
# que vaza segredo.

stages:
  - seguranca
  - qualidade
  - teste
  - integracao

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_CACHE_DIR: '1'
  # Clone raso serve para tudo, menos para a varredura de histórico.
  GIT_DEPTH: '20'

default:
  interruptible: true

# ---------------------------------------------------------------- segurança

gitleaks:
  stage: seguranca
  image:
    name: zricethezav/gitleaks:latest
    # A imagem tem ENTRYPOINT ["gitleaks"]; sem zerar, o script viraria
    # `gitleaks gitleaks detect ...`.
    entrypoint: ['']
  variables:
    # Varredura do histórico inteiro: um segredo removido no commit
    # seguinte continua publicado e precisa ser detectado.
    GIT_DEPTH: '0'
  script:
    - gitleaks detect --source . --no-banner --redact --verbose

# Roda no PISO declarado, não na versão corrente. Como o job instala sem
# pins, o interpretador mais baixo resolve as versões mais antigas — que é
# onde as vulnerabilidades moram. Auditar o piso domina auditar o teto.
#
# São dois pisos: o da lib (3.10) e o do extra `front` (3.11, ver o
# pyproject). Um job só no 3.10 não veria o front, que ali não resolve.
#
# A ferramenta mora num venv e o alvo em outro. Instalados juntos, o
# pip-audit audita a si mesmo: o `filelock` dele (via CacheControl) tem
# CVE sem correção para 3.10, e reprovava o job por algo que nunca chega a
# quem instala a lib. PIPAPI_PYTHON_LOCATION aponta o pip-audit para o
# interpretador do alvo.
.pip-audit:
  stage: seguranca
  variables:
    ALVO: '.'
  script:
    - python -m venv /opt/ferramenta
    - /opt/ferramenta/bin/pip install --upgrade pip
    - /opt/ferramenta/bin/pip install pip-audit
    - python -m venv /opt/alvo
    # O pip e o setuptools do alvo também são auditados, e os do venv de
    # 3.10 são antigos — sobem antes.
    - /opt/alvo/bin/pip install --upgrade pip setuptools
    # A imagem é bookworm (glibc 2.36), que satisfaz o manylinux_2_35 do
    # `pytauri-wheel`; aqui só se instala, então as libs de gtk que
    # faltariam para importar não fazem falta.
    - /opt/alvo/bin/pip install "$ALVO"
    - >-
      PIPAPI_PYTHON_LOCATION=/opt/alvo/bin/python
      /opt/ferramenta/bin/pip-audit --progress-spinner off

pip-audit:3.10:
  extends: .pip-audit
  image: python:3.10-slim

pip-audit:front:
  extends: .pip-audit
  image: python:3.11-slim
  variables:
    ALVO: '.[front]'

# ---------------------------------------------------------------- qualidade

ruff:
  stage: qualidade
  image: python:3.13-slim
  script:
    - pip install ruff==0.11.7
    # `check` puro: o alvo `lint` do taskipy usa --diff, que mostra a
    # correção mas não reprova.
    - ruff check .

# ------------------------------------------------------------------- testes

.testes:
  stage: teste
  script:
    - pip install --upgrade pip
    # Sem pins aqui de propósito: o pip resolve a versão compatível com o
    # interpretador de cada job da matriz.
    - pip install . pytest pytest-cov requests-mock
    - >-
      pytest . -m "not integracao"
      --cov=param_manager --cov-report=term
      --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week
  coverage: '/^TOTAL.+?(\d+\%)$/'

# A biblioteca declara requires-python = ">=3.10", sem teto. Piso, meio,
# a versão de uso corrente e a mais nova publicada: uma quebra de sintaxe
# nova já chegou ao PyPI antes de existir esta matriz, e sem teto é o job
# da versão mais nova que segura a promessa.
testes:3.10:
  extends: .testes
  image: python:3.10-slim

testes:3.12:
  extends: .testes
  image: python:3.12-slim

testes:3.13:
  extends: .testes
  image: python:3.13-slim

testes:3.14:
  extends: .testes
  image: python:3.14-slim

# --------------------------------------------------------------- integração

integracao:
  stage: integracao
  image: python:3.13-slim
  script:
    - pip install --upgrade pip
    - pip install . pytest requests-mock
    # Estes testes escrevem num arquivo TinyDB real; nada de mock de
    # persistência. Sem serviço externo.
    - pytest . -m integracao -v
